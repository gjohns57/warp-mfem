<svg viewBox="0 0 1020 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1020" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="510" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">Candidate Conflict Removal &#8212; Two-Tet Example</text>
  <text x="510" y="49" text-anchor="middle" font-size="12.5" fill="#555">
    Tets A and B share the face {0,1,2}. Each tet already picked its own highest-scoring edge as a PENDING candidate.
  </text>

  <!-- ===================== PANEL 1 ===================== -->
  <g>
    <text x="230" y="80" text-anchor="middle" font-size="11" fill="#888">pick_highest_score_candidate (done)</text>
    <text x="230" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Step 1 &#8212; local best edges flagged PENDING</text>

    <!-- Tet region tints -->
    <rect x="40" y="150" width="250" height="180" rx="20" fill="#f59e0b" fill-opacity="0.10" stroke="#f59e0b" stroke-opacity="0.35" stroke-dasharray="4 3"/>
    <rect x="170" y="150" width="250" height="180" rx="20" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-opacity="0.35" stroke-dasharray="4 3"/>
    <text x="80" y="168" font-size="11.5" font-weight="700" fill="#b45309">Tet A = {0,1,2,3}</text>
    <text x="380" y="168" text-anchor="end" font-size="11.5" font-weight="700" fill="#1d4ed8">Tet B = {0,1,2,4}</text>

    <!-- base edges (gray, available) -->
    <g stroke="#aaaaaa" stroke-width="2">
      <line x1="230" y1="190" x2="280" y2="300"/> <!-- v0-v2 -->
      <line x1="70"  y1="250" x2="230" y2="190"/> <!-- v3-v0 -->
      <line x1="70"  y1="250" x2="180" y2="300"/> <!-- v3-v1 -->
      <line x1="70"  y1="250" x2="280" y2="300"/> <!-- v3-v2 -->
      <line x1="390" y1="250" x2="230" y2="190"/> <!-- v4-v0 -->
      <line x1="390" y1="250" x2="180" y2="300"/> <!-- v4-v1 -->
      <line x1="390" y1="250" x2="280" y2="300"/> <!-- v4-v2 -->
    </g>

    <!-- candidate edges (highlighted) -->
    <line x1="180" y1="300" x2="280" y2="300" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/> <!-- A's pick: 1-2 -->
    <line x1="230" y1="190" x2="180" y2="300" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/> <!-- B's pick: 0-1 -->

    <!-- vertices -->
    <g>
      <circle cx="230" cy="190" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
      <text x="230" y="195" text-anchor="middle" font-size="13" font-weight="700">0</text>
      <circle cx="180" cy="300" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
      <text x="180" y="305" text-anchor="middle" font-size="13" font-weight="700">1</text>
      <circle cx="280" cy="300" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
      <text x="280" y="305" text-anchor="middle" font-size="13" font-weight="700">2</text>
      <circle cx="70" cy="250" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
      <text x="70" y="255" text-anchor="middle" font-size="13" font-weight="700">3</text>
      <circle cx="390" cy="250" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
      <text x="390" y="255" text-anchor="middle" font-size="13" font-weight="700">4</text>
    </g>

    <!-- badges -->
    <rect x="163" y="316" width="134" height="24" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="230" y="332" text-anchor="middle" font-size="11" fill="#b45309" font-weight="700">A&#8217;s pick &#8226; PENDING</text>

    <rect x="8" y="172" width="142" height="24" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="79" y="188" text-anchor="middle" font-size="11" fill="#1d4ed8" font-weight="700">B&#8217;s pick &#8226; PENDING</text>
    <line x1="79" y1="196" x2="205" y2="245" stroke="#2563eb" stroke-width="1" stroke-dasharray="2 2"/>
  </g>

  <!-- ===================== ARROW ===================== -->
  <g>
    <line x1="430" y1="250" x2="598" y2="250" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="514" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">remove_conflicting_candidates</text>
    <text x="514" y="272" text-anchor="middle" font-size="10.5" fill="#555">Tet A: edge (0,1) is PENDING but</text>
    <text x="514" y="286" text-anchor="middle" font-size="10.5" fill="#555">isn&#8217;t A&#8217;s pick (1,2) &#8594; revert</text>
    <text x="514" y="304" text-anchor="middle" font-size="10.5" fill="#555">Tet B: edge (1,2) is PENDING but</text>
    <text x="514" y="318" text-anchor="middle" font-size="10.5" fill="#555">isn&#8217;t B&#8217;s pick (0,1) &#8594; revert</text>
  </g>

  <!-- ===================== PANEL 2 ===================== -->
  <g>
    <text x="800" y="80" text-anchor="middle" font-size="11" fill="#888">remove_conflicting_candidates (this round)</text>
    <text x="800" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Step 2 &#8212; both candidates revert to AVAILABLE</text>

    <rect x="610" y="150" width="250" height="180" rx="20" fill="#f59e0b" fill-opacity="0.10" stroke="#f59e0b" stroke-opacity="0.35" stroke-dasharray="4 3"/>
    <rect x="740" y="150" width="250" height="180" rx="20" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-opacity="0.35" stroke-dasharray="4 3"/>
    <text x="650" y="168" font-size="11.5" font-weight="700" fill="#b45309">Tet A = {0,1,2,3}</text>
    <text x="950" y="168" text-anchor="end" font-size="11.5" font-weight="700" fill="#1d4ed8">Tet B = {0,1,2,4}</text>

    <g stroke="#aaaaaa" stroke-width="2">
      <line x1="800" y1="190" x2="850" y2="300"/>
      <line x1="640" y1="250" x2="800" y2="190"/>
      <line x1="640" y1="250" x2="750" y2="300"/>
      <line x1="640" y1="250" x2="850" y2="300"/>
      <line x1="960" y1="250" x2="800" y2="190"/>
      <line x1="960" y1="250" x2="750" y2="300"/>
      <line x1="960" y1="250" x2="850" y2="300"/>
    </g>

    <!-- reverted candidate edges: gray dashed now -->
    <line x1="750" y1="300" x2="850" y2="300" stroke="#9ca3af" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 6"/>
    <line x1="800" y1="190" x2="750" y2="300" stroke="#9ca3af" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 6"/>

    <g>
      <circle cx="800" cy="190" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
      <text x="800" y="195" text-anchor="middle" font-size="13" font-weight="700">0</text>
      <circle cx="750" cy="300" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
      <text x="750" y="305" text-anchor="middle" font-size="13" font-weight="700">1</text>
      <circle cx="850" cy="300" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
      <text x="850" y="305" text-anchor="middle" font-size="13" font-weight="700">2</text>
      <circle cx="640" cy="250" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
      <text x="640" y="255" text-anchor="middle" font-size="13" font-weight="700">3</text>
      <circle cx="960" cy="250" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
      <text x="960" y="255" text-anchor="middle" font-size="13" font-weight="700">4</text>
    </g>

    <rect x="723" y="316" width="154" height="24" rx="12" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="800" y="332" text-anchor="middle" font-size="11" fill="#4b5563" font-weight="700">&#8634; AVAILABLE again</text>

    <rect x="578" y="172" width="154" height="24" rx="12" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="655" y="188" text-anchor="middle" font-size="11" fill="#4b5563" font-weight="700">&#8634; AVAILABLE again</text>
    <line x1="655" y1="196" x2="775" y2="245" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2 2"/>
  </g>

  <!-- ===================== LEGEND ===================== -->
  <g font-size="11" fill="#333">
    <line x1="90"  y1="425" x2="120" y2="425" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
    <text x="128" y="429">Tet A&#8217;s candidate edge</text>

    <line x1="300" y1="425" x2="330" y2="425" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
    <text x="338" y="429">Tet B&#8217;s candidate edge</text>

    <line x1="510" y1="425" x2="540" y2="425" stroke="#aaaaaa" stroke-width="2"/>
    <text x="548" y="429">other AVAILABLE edges</text>

    <line x1="720" y1="425" x2="750" y2="425" stroke="#9ca3af" stroke-width="4" stroke-dasharray="7 6" stroke-linecap="round"/>
    <text x="758" y="429">reverted this round</text>
  </g>

  <!-- Footer -->
  <text x="510" y="465" text-anchor="middle" font-size="11.5" fill="#444">
    Result: neither (0,1) nor (1,2) is finalized this round &#8212; both re-enter the score competition on the
  </text>
  <text x="510" y="481" text-anchor="middle" font-size="11.5" fill="#444">
    next conflict-resolution iteration (run up to conflict_iterations = 5 times before finalizing).
  </text>
</svg>
